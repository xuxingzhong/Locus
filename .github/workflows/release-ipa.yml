name: Release IPA

on:
  push:
    branches:
      - main
    paths:
      - ".release-version"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override, for example 1.1.0. Leave empty to use .release-version."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="$(tr -d '[:space:]' < .release-version)"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version '$VERSION'."
            exit 1
          fi
          TAG_NAME="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Skip existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG_NAME already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 26
        if: steps.existing.outputs.exists != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install XcodeGen
        if: steps.existing.outputs.exists != 'true'
        run: brew install xcodegen

      - name: Set release version
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i '' -E 's/MARKETING_VERSION: "[^"]+"/MARKETING_VERSION: "'"$VERSION"'"/' project.yml
          echo "Release version: $VERSION"

      - name: Generate Xcode project
        if: steps.existing.outputs.exists != 'true'
        run: xcodegen generate

      - name: Build unsigned app
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/LocusDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        if: steps.existing.outputs.exists != 'true'
        run: |
          APP_PATH="$RUNNER_TEMP/LocusDerivedData/Build/Products/Release-iphoneos/Locus.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Locus.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Locus-unsigned.ipa" Payload

      - name: Create release tag
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME" "$GITHUB_SHA"
            git push origin "$TAG_NAME"
          fi

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Locus ${{ steps.version.outputs.tag }}
          files: Locus-unsigned.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
